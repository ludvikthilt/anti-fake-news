# Déploiement Render — « New + » → « Blueprint » → sélectionner ce dépôt.
# Les valeurs marquées sync: false se renseignent dans le tableau de bord.
databases:
  - name: antifake-db
    databaseName: antifake
    user: antifake
    plan: free
    region: frankfurt

services:
  - type: web
    name: antifake-api
    runtime: docker
    plan: free
    region: frankfurt
    # Le Dockerfile est cherché dans rootDir.
    rootDir: ./backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health/
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: antifake-db
          property: connectionString
      - key: DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_SUPERUSER_EMAIL
        value: ludviktybho@gmail.com
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: ALLOWED_HOSTS
        value: antifake-api.onrender.com,.onrender.com
      - key: FRONTEND_URL
        value: https://antifake-web.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://antifake-web.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://antifake-web.onrender.com
      - key: BACKEND_BASE_URL
        value: https://antifake-api.onrender.com
      - key: SECURE_SSL_REDIRECT
        value: "true"
      - key: CACHE_BACKEND
        value: db
      - key: AI_MODE
        value: gemini
      - key: SEARCH_PROVIDER
        value: tavily
      - key: EMAIL_FROM
        value: ludviktybho@gmail.com
      # Peuplement automatique des données de démonstration au démarrage (idempotent).
      # Passer à "false" pour démarrer sur une base vide.
      - key: SEED_DEMO
        value: "true"
      # Clés à saisir dans le tableau de bord (jamais dans ce fichier).
      - key: TAVILY_API_KEY
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: SEARCHAPI_API_KEY
        sync: false
      - key: EXA_API_KEY
        sync: false
      - key: FACTCHECK_API_KEY
        sync: false
      - key: OCRSPACE_API_KEY
        sync: false
      - key: APIFY_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        value: https://antifake-web.onrender.com/compte/google/callback
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        value: ThiltBot
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: INTERNAL_TOKEN
        sync: false

  - type: web
    name: antifake-web
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: ./frontend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # Adresse publique de l'API, lue à l'exécution (pas besoin de reconstruire).
      - key: API_URL
        value: https://antifake-api.onrender.com/api
      - key: NEXT_PUBLIC_APP_NAME
        value: InfoxVerify
      # Identifiant OAuth public : lisible par tous, ce n'est pas un secret.
      - key: GOOGLE_CLIENT_ID
        value: 294321887889-6d0u6qekbvrhimj5940t090rtnu3rbcn.apps.googleusercontent.com
